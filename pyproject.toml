[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pair-memory-template"
version = "0.1.0"
description = "Shared memory MCP template for Cursor + Kimi pair workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "wwwG1n" }
]
dependencies = [
  "mcp[cli]>=1.27.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
shared-memory-mcp = "shared_memory_mcp.server:main"

[tool.setuptools.package-dir]
"" = "tools/shared_memory_mcp"

[tool.setuptools.packages.find]
where = ["tools/shared_memory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "tools/shared_memory_mcp",
]
